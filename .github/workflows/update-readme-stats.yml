name: Update GitHub README Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/scripts/update_github_stats.py"
      - ".github/workflows/update-readme-stats.yml"

permissions:
  contents: write

concurrency:
  group: update-profile-readme-stats
  cancel-in-progress: true

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test updater
        run: python -m unittest discover -s .github/scripts -p "test_*.py"

      - name: Update GitHub technologies and public statistics
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          README_PATH: readme.md
        run: python .github/scripts/update_github_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readme.md

          if git diff --cached --quiet; then
            echo "No README changes."
            exit 0
          fi

          git commit -m "chore: update GitHub profile stats"
          git push
